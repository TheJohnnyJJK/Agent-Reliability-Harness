<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="p2t">
  <title id="p2t">Three racer robots labeled LangGraph, CrewAI, and AG2, standing at a starting line</title>
  <rect width="640" height="200" rx="20" fill="#12162A"/>
  <text x="320" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#B9C0DE" text-anchor="middle">Three racers, same question</text>
  <line x1="30" y1="170" x2="610" y2="170" stroke="#3A4276" stroke-width="2" stroke-dasharray="6 6"/>

  <g transform="translate(110,60)" color="#F2A65A">
    <rect x="0" y="20" width="60" height="52" rx="18" fill="currentColor" opacity="0.28" stroke="currentColor" stroke-width="2.4"/>
    <circle cx="18" cy="42" r="4.2" fill="currentColor"/>
    <circle cx="42" cy="42" r="4.2" fill="currentColor"/>
    <rect x="12" y="-4" width="36" height="30" rx="13" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.4"/>
    <text x="30" y="96" font-family="JetBrains Mono, monospace" font-size="13" fill="#F5EFE0" text-anchor="middle">LangGraph</text>
  </g>

  <g transform="translate(290,60)" color="#6FA8DC">
    <rect x="0" y="20" width="60" height="52" rx="18" fill="currentColor" opacity="0.28" stroke="currentColor" stroke-width="2.4"/>
    <circle cx="18" cy="42" r="4.2" fill="currentColor"/>
    <circle cx="42" cy="42" r="4.2" fill="currentColor"/>
    <rect x="12" y="-4" width="36" height="30" rx="13" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.4"/>
    <text x="30" y="96" font-family="JetBrains Mono, monospace" font-size="13" fill="#F5EFE0" text-anchor="middle">CrewAI</text>
  </g>

  <g transform="translate(470,60)" color="#C792EA">
    <rect x="0" y="20" width="60" height="52" rx="18" fill="currentColor" opacity="0.28" stroke="currentColor" stroke-width="2.4"/>
    <circle cx="18" cy="42" r="4.2" fill="currentColor"/>
    <circle cx="42" cy="42" r="4.2" fill="currentColor"/>
    <rect x="12" y="-4" width="36" height="30" rx="13" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.4"/>
    <text x="30" y="96" font-family="JetBrains Mono, monospace" font-size="13" fill="#F5EFE0" text-anchor="middle">AG2</text>
  </g>
