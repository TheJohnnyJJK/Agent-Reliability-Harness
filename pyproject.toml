[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Same bar as the lead-router sibling project: correctness + bugs + security
# + modernization, not ruff's full rule set (too much house-style noise).
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "PIE"]
ignore = [
  "S105", "S106",  # hardcoded-password checks - false-positive on non-secret fields named password-adjacent
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the correct tool in test files
# `random` here builds the fixed synthetic dataset from a hardcoded seed -
# never used for anything security-sensitive (no tokens, no secrets, no auth).
"dataset/seed_data.py" = ["S311"]
# Generated HTML/CSS/JS template strings genuinely run long (inline styles,
# template literals) - wrapping them hurts readability more than a capped
# line length helps. Real Python control flow in this file still follows
# the 100-char limit; only the template body is exempt.
"report/generate_report.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_anthropic.*", "crewai.*", "ag2.*"]
ignore_missing_imports = true
